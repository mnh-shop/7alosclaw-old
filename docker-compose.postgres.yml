# PostgreSQL overlay — pgvector for multi-tenant storage.
#
# Usage (web dashboard built-in by default):
#   make up
#   # or: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# Required env vars (set in .env or shell):
#   ZALOSCLAW_OPENROUTER_API_KEY (or another provider key)
#   POSTGRES_PASSWORD (defaults to "zalosclaw" for dev)
#
# If host port 5432 is already in use, set POSTGRES_PORT (e.g. 5433) in .env.
# The zalosclaw container still connects via postgres:5432 on the Docker network.

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zalosclaw}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zalosclaw}
      POSTGRES_DB: ${POSTGRES_DB:-zalosclaw}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zalosclaw} -d ${POSTGRES_DB:-zalosclaw}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  zalosclaw:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - ZALOSCLAW_POSTGRES_DSN=postgres://${POSTGRES_USER:-zalosclaw}:${POSTGRES_PASSWORD:-zalosclaw}@postgres:5432/${POSTGRES_DB:-zalosclaw}?sslmode=disable
    volumes:
      - zalosclaw-skills:/app/skills
      - zalosclaw-workspace:/app/.zalosclaw

volumes:
  postgres-data:
  zalosclaw-skills:
