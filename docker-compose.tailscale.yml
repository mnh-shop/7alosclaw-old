# Tailscale overlay — rebuilds with tsnet support for secure remote access.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.tailscale.yml up
#
# Required:
#   ZALOSCLAW_TSNET_AUTH_KEY — Tailscale auth key (from https://login.tailscale.com/admin/settings/keys)
#
# Optional:
#   ZALOSCLAW_TSNET_HOSTNAME — Tailscale device name (default: zalosclaw-gateway)

services:
  zalosclaw:
    build:
      args:
        ENABLE_TSNET: "true"
    environment:
      - ZALOSCLAW_TSNET_HOSTNAME=${ZALOSCLAW_TSNET_HOSTNAME:-zalosclaw-gateway}
      - ZALOSCLAW_TSNET_AUTH_KEY=${ZALOSCLAW_TSNET_AUTH_KEY}
    volumes:
      - tsnet-state:/app/tsnet-state

volumes:
  tsnet-state:
