# Upgrade overlay — one-shot database upgrade service.
#
# Usage:
#   # Preview changes (dry-run):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --dry-run
#
#   # Apply upgrade:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade
#
#   # Check status:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --status
#
# The upgrade service runs zalosclaw upgrade and exits. Use --rm to auto-remove the container.

services:
  upgrade:
    image: ghcr.io/nextlevelbuilder/zalosclaw:latest
    build:
      context: ${ZALOSCLAW_DIR:-.}
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: "false"
    env_file:
      - path: .env
        required: false
    environment:
      - ZALOSCLAW_POSTGRES_DSN=postgres://${POSTGRES_USER:-zalosclaw}:${POSTGRES_PASSWORD:-zalosclaw}@postgres:5432/${POSTGRES_DB:-zalosclaw}?sslmode=disable
      - ZALOSCLAW_CONFIG=/app/data/config.json
      - ZALOSCLAW_MIGRATIONS_DIR=/app/migrations
      - ZALOSCLAW_ENCRYPTION_KEY=${ZALOSCLAW_ENCRYPTION_KEY:-}
    volumes:
      - zalosclaw-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/zalosclaw"]
    command: ["upgrade"]
    restart: "no"
